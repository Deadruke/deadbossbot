services:
  - type: worker
    name: deadbossbot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: MAX_PARALLEL_TASKS
        value: "2"
      - key: FREE_TASK_LIMIT
        value: "2"
